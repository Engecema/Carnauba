services:
    carnauba:
        container_name: carnauba
        restart: always
        working_dir: /var/www/html
        extra_hosts:
            - host.docker.internal:host-gateway
        expose:
            - "6001"
            - "6002"
        networks:
            - carnauba
        depends_on:
            - postgres
            - redis
    postgres:
        image: postgres:15-alpine
        container_name: carnauba-db
        restart: always
        networks:
            - carnauba
    redis:
        image: redis:7-alpine
        container_name: carnauba-redis
        restart: always
        networks:
            - carnauba
networks:
    carnauba:
        name: carnauba
        driver: bridge
        external: false
